services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imeceburada
      POSTGRES_PASSWORD: imeceburada
      POSTGRES_DB: imeceburada
    ports:
      - "5432:5432"
    volumes:
      - imeceburada_pgdata:/var/lib/postgresql/data

volumes:
  imeceburada_pgdata:
