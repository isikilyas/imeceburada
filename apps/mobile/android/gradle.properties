org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Some contributors' checkouts live under a non-ASCII path (e.g. a Turkish
# "Masaüstü" desktop folder) — AGP's path check otherwise hard-fails the build
# there even though the build itself works fine. See http://b.android.com/95744.
android.overridePathCheck=true
