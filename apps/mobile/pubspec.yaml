name: imeceburada
description: İmece Burada - İnşaat sektörüne özel iş ilanları ve canlı piyasa endeksi
publish_to: "none"
version: 1.0.3+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  intl: ^0.19.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  webview_flutter: ^4.9.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash_icon.png
    - assets/app_icon.png

flutter_native_splash:
  color: "#0a0c10"
  image: assets/splash_icon.png
  android_12:
    color: "#0a0c10"
    image: assets/splash_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  background_color: "#0a0c10"
  theme_color: "#0a0c10"
  adaptive_icon_background: "#0a0c10"
  adaptive_icon_foreground: "assets/app_icon.png"
